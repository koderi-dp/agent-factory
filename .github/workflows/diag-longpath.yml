name: diag-longpath

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Long path and git diff probe
        shell: pwsh
        run: |
          Write-Output "git: $(git --version)"
          Write-Output "LongPathsEnabled: $((Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -EA SilentlyContinue).LongPathsEnabled)"
          $chr = [char]0x010D
          $sandbox = Join-Path $env:TEMP "pytest-of-runneradmin\pytest-0\sb0\sandbox $chr with spaces"
          $dir = Join-Path $sandbox "todo-app-1-418cf3-factory\002-show-the-number-of-open-todos-in-the-page-title-like-todos-3"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          git init -q .
          Set-Content -Path a.txt -Value "x"
          git add a.txt
          git -c user.email=a@b.c -c user.name=a commit -qm init
          $sha = (git rev-parse HEAD).Trim()
          Write-Output "cwdLen=$($dir.Length) argLen=$($sha.Length * 2 + 2) combined=$($dir.Length + 1 + $sha.Length * 2 + 2)"
          Write-Output "--- empty range, default ---"
          $out = git diff --stat "$sha..$sha" 2>&1
          Write-Output "exit=$LASTEXITCODE"
          $out | ForEach-Object { "OUT: $_" }
          Write-Output "--- empty range, core.longpaths=true ---"
          $out = git -c core.longpaths=true diff --stat "$sha..$sha" 2>&1
          Write-Output "exit=$LASTEXITCODE"
          $out | ForEach-Object { "OUT: $_" }
          Write-Output "--- log empty range ---"
          $out = git log --oneline -51 "$sha..$sha" 2>&1
          Write-Output "exit=$LASTEXITCODE"
          $out | ForEach-Object { "OUT: $_" }
          Set-Content -Path b.txt -Value "y"
          git add b.txt
          git -c user.email=a@b.c -c user.name=a commit -qm second
          $sha2 = (git rev-parse HEAD).Trim()
          Write-Output "--- non-empty range ---"
          $out = git diff --stat "$sha..$sha2" 2>&1
          Write-Output "exit=$LASTEXITCODE"
          $out | ForEach-Object { "OUT: $_" }
          Write-Output "--- nonexistent range, default ---"
          $out = git diff --stat "deadbeefdeadbeefdeadbeefdeadbeefdeadbeef..deadbeefdeadbeefdeadbeefdeadbeefdeadbeef" 2>&1
          Write-Output "exit=$LASTEXITCODE"
          $out | ForEach-Object { "OUT: $_" }
