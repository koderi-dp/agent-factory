<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff79c6;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 28px 32px 8px;
  }
  .title { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .summary { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .summary b { font-weight: 600; color: var(--text); }
  .summary .needs b { color: var(--human); }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Backlog */
  .queue {
    margin: 14px 32px 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); display: flex; gap: 10px; align-items: baseline; min-width: 0;
  }
  .queue h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .queue .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; }
  .queue ol { margin: 0; padding: 0; list-style: none; display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .queue li {
    font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--line); max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .queue li:first-child { border-color: color-mix(in srgb, var(--active) 45%, var(--line)); }
  .queue .more { color: var(--faint); font-size: 12px; }

  /* Board */
  .board {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;
    padding: 20px 32px 40px; align-items: start;
  }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 10px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative;
  }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .col-head .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .col:not(:last-child):not(:nth-last-child(2)) .col-head::after {
    content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px;
  }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  .col.merged-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }
  .show-all {
    width: 100%; background: none; border: 1px dashed var(--line); border-radius: 8px;
    padding: 6px; color: var(--muted); font-family: var(--mono); font-size: 11px; cursor: pointer;
  }
  .show-all:hover { color: var(--text); border-color: var(--muted); }
  .show-all:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent),
                0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.merged { opacity: .72; }
  .card.broken { border-style: dashed; cursor: default; }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--active); flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .pulse.still { animation: none; background: var(--changes); }
  .flag {
    margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--human); white-space: nowrap;
  }
  .flag.quiet { color: var(--changes); }
  .flag.ok { color: var(--pass); }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .branch {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px;
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
  }
  .meta .fu { color: var(--changes); }
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 20px; }
  .chip {
    flex: 1; text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .hint {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6;
    overflow-wrap: anywhere;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease, visibility 0s linear .25s; visibility: hidden;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; visibility: visible; transition: transform .25s ease; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .d-head .branch { white-space: normal; overflow-wrap: anywhere; }
  .timeline {
    margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 6px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .timeline li + li::before { content: "›"; margin-right: 6px; color: var(--faint); }
  .timeline b { font-weight: 600; color: var(--text); }
  .timeline .t { color: var(--faint); }
  .timeline:empty { display: none; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .close:focus-visible, .file:focus-visible { outline: 2px solid var(--active); outline-offset: 1px; }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto; overflow-wrap: normal;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; overflow-wrap: normal; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner, .queue { margin: 12px 16px 0; }
    .queue { flex-direction: column; gap: 6px; }
    .queue li { max-width: 100%; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>Software factory</h1>
    <div class="summary" id="summary"></div>
  </div>
  <div class="status" id="status" role="status">connecting…</div>
</header>
<div id="banner"></div>
<div id="queue"></div>
<main class="board" id="board"></main>
<footer>
  <span>/factory &lt;feature&gt;</span>
  <span>/factory next</span>
  <span>/factory approve &lt;job-id&gt;</span>
  <span>/factory rework &lt;job-id&gt; &lt;note&gt;</span>
  <span>/factory resume &lt;job-id&gt;</span>
</footer>

<div id="overlay" inert>
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="branch" id="d-branch"></div>
      <ol class="timeline" id="d-timeline"></ol>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files" aria-label="Job files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const QUIET_MS = 3 * 60 * 60 * 1000 // a live job with no job.json write for this long may have lost its session
const MERGED_SHOWN = 5
const STAGES = [
  { key: 'spec', label: 'Spec', who: 'spec-writer · opus' },
  { key: 'build', label: 'Build', who: 'builder · opus' },
  { key: 'review', label: 'Review', who: 'sec · ux · ui · code' },
  { key: 'approve', label: 'Approve', who: 'approver · opus' },
  { key: 'merged', label: 'Merged', who: 'main', cls: 'merged-col' },
  { key: 'needs-human', label: 'Needs human', who: 'approve · rework', cls: 'human' },
]
const LIVE = new Set(['spec', 'build', 'review', 'approve'])
const REVIEWERS = [['security', 'sec'], ['ux', 'ux'], ['ui', 'ui'], ['code', 'code']]

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let jobs = []
let backlog = []
let lastRender = ''
let showAllMerged = false
const roundCache = new Map() // "<job>/<n>" -> verdicts of a finished round
const goodJobs = new Map() // id -> last job.json that parsed, so a half-written file doesn't flicker
const decisions = new Map() // id -> { updated, verdict, followUps } from decision.md
let openJobId = null
let openPath = null
let openText = null
let opener = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

async function fetchOptional(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (res.status === 404) return null
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

// ---- Time ----------------------------------------------------------------

function ago(ms) {
  const m = Math.max(0, Math.round(ms / 60000))
  if (m < 1) return '<1m'
  if (m < 60) return `${m}m`
  const h = Math.floor(m / 60)
  if (h < 48) return `${h}h ${String(m % 60).padStart(2, '0')}m`
  return `${Math.floor(h / 24)}d`
}

const at = (s) => (s ? Date.parse(s) : NaN)

function stageSince(job) {
  const last = (job.history || []).at(-1)
  return last ? at(last.at) : NaN
}

function took(job) {
  const start = at(job.created || (job.history || [])[0]?.at)
  const end = stageSince(job)
  return start && end && end > start ? end - start : NaN
}

// ---- Board ---------------------------------------------------------------

function verdictOf(text) {
  const m = text.split('\n')[0].trim().match(/^VERDICT:\s*(PASS|CHANGES)$/)
  return m ? m[1] : 'invalid'
}

// Earlier rounds aren't in job.json; their verdicts come from the review files.
async function pastRounds(job) {
  const rounds = []
  for (let n = 1; n < job.round; n++) {
    const key = `${job.id}/${n}`
    if (!roundCache.has(key)) {
      const verdicts = {}
      await Promise.all(REVIEWERS.map(async ([k]) => {
        try {
          verdicts[k] = verdictOf(await fetchText(`jobs/${job.id}/round-${n}/review-${k}.md`))
        } catch {
          verdicts[k] = 'missing'
        }
      }))
      if (Object.values(verdicts).every((v) => v === 'PASS' || v === 'CHANGES')) {
        roundCache.set(key, verdicts)
      } else {
        rounds.push(verdicts)
        continue
      }
    }
    rounds.push(roundCache.get(key))
  }
  return rounds
}

// Lines under "## Follow-ups" in decision.md, not counting "None.".
function countFollowUps(text) {
  const lines = text.replace(/\r/g, '').split('\n')
  const start = lines.findIndex((l) => /^##\s+Follow-ups\s*$/i.test(l))
  if (start < 0) return 0
  let count = 0
  for (const l of lines.slice(start + 1)) {
    if (/^#{1,2}\s/.test(l)) break
    if (/^\s{0,1}([-*+]|\d+\.)\s+/.test(l)) count++
  }
  return count
}

async function decisionOf(job) {
  const none = { verdict: null, followUps: 0 }
  if (job.stage !== 'merged' && job.stage !== 'needs-human') return none
  const cached = decisions.get(job.id)
  if (cached && cached.updated === job.updated) return cached
  const text = await fetchOptional(`jobs/${job.id}/decision.md`).catch(() => null)
  const d = text
    ? { updated: job.updated, verdict: text.split('\n')[0].trim(), followUps: countFollowUps(text) }
    : { updated: job.updated, ...none }
  decisions.set(job.id, d)
  return d
}

function chips(n, verdicts, waiting) {
  const cells = REVIEWERS.map(([k, short]) => {
    const v = verdicts[k]
    const cls = v === 'PASS' || v === 'CHANGES' ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
    const label = v === 'missing' || v === 'invalid' ? `${short}?` : short
    return `<span class="chip ${cls}" title="${k}: ${esc(v)}">${label}</span>`
  }).join('')
  return `<div class="round"><span class="r">R${n}</span>${cells}</div>`
}

function brokenCard(job) {
  const [num, ...slug] = job.id.split('-')
  return `
    <div class="card broken">
      <div class="card-top"><span class="num">${esc(num)} · ${esc(slug.join('-'))}</span></div>
      <p class="feature note">${esc(job.problem)}</p>
    </div>`
}

function card(job, past, decision, now) {
  if (job.problem) return brokenCard(job)
  const live = LIVE.has(job.stage)
  const human = job.stage === 'needs-human'
  // An approved job lands in Needs human only when the main checkout was busy at merge time.
  const parked = human && decision.verdict === 'APPROVE'
  const fu = decision.followUps
  const since = stageSince(job)
  const quiet = live && now - at(job.updated) > QUIET_MS
  const rows = past.map((v, i) => chips(i + 1, v, false))
  if (job.round > 0) rows.push(chips(job.round, job.reviews || {}, job.stage === 'review'))
  const [num, ...slug] = job.id.split('-')
  const meta = []
  if (live && since) meta.push(`<span title="in ${esc(job.stage)} since ${esc(new Date(since).toLocaleString())}">in ${esc(job.stage)} ${ago(now - since)}</span>`)
  if (!live && took(job)) meta.push(`<span title="from start to ${esc(job.stage)}">took ${ago(took(job))}</span>`)
  if (!live && since) meta.push(`<span>${ago(now - since)} ago</span>`)
  if (fu) meta.push(`<span class="fu">${fu} follow-up${fu === 1 ? '' : 's'}</span>`)
  const hint = parked
    ? `Approved. Merge once the main checkout is clean:<br>/factory approve ${esc(job.id)}`
    : human
    ? `/factory approve ${esc(job.id)}<br>/factory rework ${esc(job.id)} …`
    : quiet ? `No update for ${ago(now - at(job.updated))}. If its session ended:<br>/factory resume ${esc(job.id)}` : ''
  return `
    <button class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${job.stage === 'merged' ? 'merged' : ''}"
            data-job="${esc(job.id)}">
      <div class="card-top">
        ${live ? `<span class="pulse ${quiet ? 'still' : ''}" aria-label="${quiet ? 'quiet' : 'running'}"></span>` : ''}
        <span class="num">${esc(num)} · ${esc(slug.join('-'))}</span>
        ${parked ? '<span class="flag ok">approved</span>' : human ? '<span class="flag">your call</span>' : quiet ? '<span class="flag quiet">quiet</span>' : ''}
      </div>
      <p class="feature">${esc(job.feature)}</p>
      <div class="branch">${esc(job.branch)}</div>
      ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
      ${rows.length ? `<div class="rounds">${rows.join('')}</div>` : ''}
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </button>`
}

function queueHtml() {
  if (!backlog.length) return ''
  const shown = backlog.slice(0, 6)
  const rest = backlog.length - shown.length
  return `
    <section class="queue" aria-label="Backlog">
      <h2>Backlog</h2><span class="who">${backlog.length} queued · /factory next takes the first</span>
      <ol>${shown.map((b) => `<li title="${esc(b)}">${esc(b)}</li>`).join('')}
        ${rest > 0 ? `<li class="more">+${rest} more</li>` : ''}</ol>
    </section>`
}

function summaryHtml() {
  const count = (pred) => jobs.filter((j) => !j.problem && pred(j)).length
  const running = count((j) => LIVE.has(j.stage))
  const needs = count((j) => j.stage === 'needs-human')
  const merged = count((j) => j.stage === 'merged')
  const parts = [`<span><b>${running}</b> running</span>`]
  if (needs) parts.push(`<span class="needs"><b>${needs}</b> need you</span>`)
  parts.push(`<span><b>${merged}</b> merged</span>`)
  if (backlog.length) parts.push(`<span><b>${backlog.length}</b> queued</span>`)
  document.title = needs ? `(${needs}) Software Factory` : 'Software Factory'
  return parts.join('')
}

async function render() {
  const problems = []
  const now = Date.now()
  const byStage = Object.fromEntries(STAGES.map((s) => [s.key, []]))
  const [pasts, decs] = await Promise.all([
    Promise.all(jobs.map((j) => (j.problem ? [] : pastRounds(j)))),
    Promise.all(jobs.map((j) => (j.problem ? {} : decisionOf(j)))),
  ])
  jobs.forEach((job, i) => {
    const stage = job.problem ? 'spec' : job.stage
    if (!byStage[stage]) problems.push(`Job ${job.id} has unknown stage "${job.stage}"`)
    else byStage[stage].push(card(job, pasts[i], decs[i], now))
  })
  const html = STAGES.map((s) => {
    // Newest first within a column.
    let cards = byStage[s.key].reverse()
    let more = ''
    if (s.key === 'merged' && cards.length > MERGED_SHOWN) {
      more = `<button class="show-all" data-toggle-merged>${showAllMerged ? 'Show fewer' : `Show all ${cards.length}`}</button>`
      if (!showAllMerged) cards = cards.slice(0, MERGED_SHOWN)
    }
    return `
    <section class="col ${s.cls || ''}">
      <div class="col-head">
        <h2>${s.label}</h2><span class="who">${s.who}</span>
        <span class="count">${byStage[s.key].length || ''}</span>
      </div>
      ${cards.join('') || '<div class="empty">—</div>'}${more}
    </section>`
  }).join('')
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  const top = summaryHtml() + queueHtml()
  if (html + banner + top !== lastRender) {
    const focused = document.activeElement?.closest?.('[data-job]')?.dataset.job
    lastRender = html + banner + top
    $('board').innerHTML = html
    $('banner').innerHTML = banner
    $('summary').innerHTML = summaryHtml()
    $('queue').innerHTML = queueHtml()
    if (focused) document.querySelector(`[data-job="${CSS.escape(focused)}"]`)?.focus()
  }
}

async function poll() {
  const status = $('status')
  try {
    ;[jobs, backlog] = await Promise.all([loadJobs(), loadBacklog()])
    await render()
    if (openJobId) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// python -m http.server serves an HTML index for directories; read its links.
async function listDir(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  return [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
}

// Each orchestrator session writes only its own jobs/<id>/job.json. A folder can exist
// for a moment before its job.json does, and a file can be read mid-write.
async function loadJobs() {
  let hrefs
  try {
    hrefs = await listDir('jobs/')
  } catch (err) {
    if (/HTTP 404/.test(err.message)) return []
    throw err
  }
  const ids = hrefs.filter((h) => h.endsWith('/')).map((h) => h.slice(0, -1)).sort()
  return Promise.all(ids.map(async (id) => {
    const text = await fetchOptional(`jobs/${id}/job.json`)
    if (text === null) return { id, problem: 'Starting: no job.json yet.' }
    try {
      const job = JSON.parse(text)
      goodJobs.set(id, job)
      return job
    } catch {
      return goodJobs.get(id) || { id, problem: 'job.json is not valid JSON.' }
    }
  }))
}

async function loadBacklog() {
  const text = await fetchOptional('backlog.md').catch(() => null)
  if (!text) return []
  return text.replace(/\r/g, '').split('\n')
    .map((l) => l.match(/^\s*[-*]\s+\[ \]\s+(.*\S)\s*$/))
    .filter(Boolean)
    .map((m) => m[1])
}

// ---- Drawer --------------------------------------------------------------

async function listFiles(dir) {
  const out = []
  for (const h of await listDir(dir)) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

function fileRank(path) {
  const order = ['spec.md', 'build.md', 'decision.md']
  if (order.includes(path)) return [0, order.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/review-(\w+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + REVIEWERS.findIndex(([k]) => k === round[2]), path]
  return [1, 0, path] // rework-<k>.md and anything else
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|APPROVE|STATUS:\s*READY)$/.test(first)) return 'good'
  if (/^VERDICT:\s*CHANGES$/.test(first)) return 'warn'
  if (/^(ESCALATE|STATUS:\s*BLOCKED)$/.test(first)) return 'stop'
  return null
}

function timelineHtml(job) {
  const h = job.history || []
  return h.map((e, i) => {
    const t = at(e.at)
    const next = i + 1 < h.length ? at(h[i + 1].at) : job.stage === 'merged' || job.stage === 'needs-human' ? NaN : Date.now()
    const label = e.stage === 'review' && e.round ? `review R${e.round}` : e.stage
    const dur = t && next ? ` <span class="t">${ago(next - t)}</span>` : ''
    return `<li title="${esc(new Date(t).toLocaleString())}"><b>${esc(label)}</b>${dur}</li>`
  }).join('')
}

function writeHash() {
  const hash = openJobId ? `#${openJobId}${openPath ? '/' + openPath : ''}` : ''
  if (location.hash !== hash) history.replaceState(null, '', hash || location.pathname + location.search)
}

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job || job.problem) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''}`
  $('d-title').textContent = job.feature
  $('d-branch').textContent = [job.branch, job.worktree].filter(Boolean).join(' · ')
  const tl = timelineHtml(job)
  if ($('d-timeline').innerHTML !== tl) $('d-timeline').innerHTML = tl

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null
  writeHash()

  // Every file's first line drives its dot; build.md and decision.md can change, so read them all.
  const texts = new Map(await Promise.all(files.map(async (f) => [f, await fetchText(base + f)])))
  const text = openPath ? texts.get(openPath) : null

  let group = null
  const list = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(texts.get(f).split('\n')[0].trim())
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}"
      ${f === openPath ? 'aria-current="true"' : ''}><span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'
  if ($('d-files').innerHTML !== list) {
    const focused = document.activeElement?.dataset?.file
    $('d-files').innerHTML = list
    if (focused) document.querySelector(`[data-file="${CSS.escape(focused)}"]`)?.focus()
  }

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">The spec-writer hasn’t written anything yet.</p>' : markdown(text)
  }
}

async function openDrawer(id, path = null) {
  if (!jobs.some((j) => j.id === id && !j.problem)) return
  if (!openJobId) opener = document.activeElement
  openJobId = id
  openPath = path
  openText = undefined
  $('overlay').inert = false
  document.body.classList.add('open')
  document.querySelector('.close').focus()
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  if (!openJobId) return
  const id = openJobId
  openJobId = null
  writeHash()
  $('overlay').inert = true
  document.body.classList.remove('open')
  const back = document.querySelector(`[data-job="${CSS.escape(id)}"]`) || opener
  back?.focus()
  opener = null
}

document.addEventListener('click', (e) => {
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  if (e.target.closest('[data-toggle-merged]')) {
    showAllMerged = !showAllMerged
    lastRender = ''
    return render()
  }
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  // Keep Tab inside the open drawer.
  if (e.key === 'Tab' && openJobId) {
    const items = [...document.querySelectorAll('.drawer button')].filter((b) => b.offsetParent !== null)
    const [first, last] = [items[0], items.at(-1)]
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus() }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
  }
})

function openFromHash() {
  const m = decodeURIComponent(location.hash.slice(1)).match(/^([^/]+)(?:\/(.+))?$/)
  if (m) openDrawer(m[1], m[2] || null)
  else closeDrawer()
}
window.addEventListener('hashchange', openFromHash)

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) { html += `<div class="verdict ${t}">${esc(first)}</div>`; i = 1 }

  const fence = (l) => l.match(/^(\s*)(```|~~~)/)
  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isRule = (l) => /^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|\s*>|\|)/.test(l) || fence(l) || isList(l) || isRule(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    const f = fence(line)
    if (f) {
      // Fences inside list items are indented; strip that indent from the body.
      const body = []
      i++
      while (i < lines.length && !lines[i].trimStart().startsWith(f[2])) {
        body.push(lines[i].startsWith(f[1]) ? lines[i].slice(f[1].length) : lines[i].trimStart())
        i++
      }
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    if (isRule(line)) { html += '<hr>'; i++; continue }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${inline(body.join(' '))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && !fence(lines[i]) && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      const start = ordered ? Number(line.match(/^\s*(\d+)\./)[1]) : 1
      html += ordered ? `<ol${start !== 1 ? ` start="${start}"` : ''}>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll().then(() => { if (location.hash) openFromHash() })
setInterval(poll, POLL_MS)
</script>
</body>
