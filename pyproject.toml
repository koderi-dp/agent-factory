[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "agent-factory-engine"
dynamic = ["version"]
description = "A deterministic engine for local coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
  "platformdirs>=4,<5",
]

[project.scripts]
agent-factory = "agent_factory.cli:main"
factory = "agent_factory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-xdist>=3,<4",
    "httpx>=0.27,<1",
    "yapf==0.43.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.hatch.build]
artifacts = ["/src/agent_factory/dashboard_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Used by `pytest -n <workers>`; a no-op for serial runs.
addopts = "--dist=loadgroup"

[tool.yapf]
based_on_style = "pep8"
column_limit = 100
indent_width = 4

[tool.yapfignore]
ignore_patterns = [
  ".git/**",
  ".venv/**",
  "dist/**",
  "node_modules/**",
  "**/node_modules/**",
  "tests/fixtures/**",
]
